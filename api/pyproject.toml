[project]
name = "portal-api"
version = "0.1.0"
description = "AI portal backend: API keys, CLI device login, usage ingest, admin"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.37",
  "asyncpg>=0.30",
  "redis>=6.4",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portal_api"]
