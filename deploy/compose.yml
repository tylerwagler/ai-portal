# AI portal: portal-api serves the web app, the installers, the portal API, and Supabase
# Auth's public OIDC endpoints. The Cloudflare tunnel routes each public path straight to
# its service (see deploy/cloudflare/tunnel-ingress.json); no reverse proxy runs here.
# Secrets and host-specific values come from deploy/.env (not in git); see .env.example.
name: ai-portal

services:
  portal-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        VITE_SUPABASE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
        VITE_FIRST_PARTY_CLIENTS: ${FIRST_PARTY_CLIENTS:-}
    restart: unless-stopped
    environment:
      PORTAL_DATABASE_URL: ${PORTAL_DATABASE_URL}
      PORTAL_VALKEY_URL: ${PORTAL_VALKEY_URL}
      PORTAL_JWKS_URL: ${SUPABASE_AUTH_URL}/.well-known/jwks.json
      # More than one while the public domain moves: JWT_ISSUERS lists every account host's issuer.
      PORTAL_JWT_ISSUER: ${JWT_ISSUERS:-${PUBLIC_ACCOUNT_URL}/auth/v1}
      PORTAL_CLI_VERIFY_URL: ${PUBLIC_ACCOUNT_URL}/cli
      PORTAL_SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL}
      PORTAL_API_HOST: ${PUBLIC_API_HOST:-api.elytrondefense.ai}
      PORTAL_DASHBOARD_HOST: ${DASHBOARD_HOST:-dash.elytrondefense.ai}
      PORTAL_DASHBOARD_UPSTREAM: ${DASHBOARD_UPSTREAM:-http://switchyard.defense.lan:8081}
      # Entra access and role sync; off while the client secret is unset (see .env.example).
      PORTAL_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      PORTAL_ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      PORTAL_ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      PORTAL_ENTRA_SYNC_SECONDS: ${ENTRA_SYNC_SECONDS:-900}
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/portal/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
